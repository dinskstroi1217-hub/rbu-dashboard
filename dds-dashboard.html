<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДДС — Реестр платежей ДКБИ</title>
<link rel="stylesheet" href="dkbi-design.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--dk-font);background:var(--dk-page);color:var(--dk-ink);font-size:14px}
button,input,select,textarea{font-family:inherit}
.header{background:var(--dk-surface);border-bottom:1px solid var(--dk-line);padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:18px;font-weight:600;color:#fff}
.header .sub{color:var(--dk-ink-2);font-size:12px;margin-top:2px}
.badge{background:var(--dk-primary);color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;margin-left:auto}
.container{max-width:1400px;margin:0 auto;padding:20px 24px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:var(--dk-surface);border:1px solid var(--dk-line);border-radius:12px;padding:18px 20px}
.kpi-label{color:var(--dk-ink-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.kpi-value{font-family:var(--dk-font-num);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;color:#fff}
.kpi-value.red{color:var(--dk-danger)}.kpi-value.green{color:var(--dk-success)}.kpi-value.blue{color:var(--dk-primary-h)}.kpi-value.yellow{color:var(--dk-warning)}
.kpi-sub{color:var(--dk-ink-3);font-size:11px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.card{background:var(--dk-surface);border:1px solid var(--dk-line);border-radius:12px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--dk-line);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:600;color:#fff}
.card-sub{color:var(--dk-ink-3);font-size:12px}
.card-body{padding:18px}
/* Chart */
.bars{display:flex;align-items:flex-end;height:160px;gap:6px;padding-bottom:4px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bar{width:100%;border-radius:4px 4px 0 0;cursor:pointer;transition:opacity .15s;min-height:4px}
.bar:hover{opacity:.75}
.bar-lbl{font-size:9px;color:var(--dk-ink-3);text-align:center}
.bar-amt{font-size:9px;color:var(--dk-ink-2);text-align:center}
/* DDS */
.dds-tbl{width:100%;border-collapse:collapse}
.dds-tbl th{padding:8px 12px;color:var(--dk-ink-3);font-size:10px;font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--dk-line);text-align:left}
.dds-tbl td{padding:9px 12px;border-bottom:1px solid var(--dk-surface-2);vertical-align:top}
.dds-tbl tr:hover td{background:var(--dk-surface-2)}
.code{color:var(--dk-primary);font-size:10px;font-weight:600}
.art-name{color:var(--dk-ink-2);font-size:12px}
.prog{height:3px;background:var(--dk-line);border-radius:2px;margin-top:5px}
.prog-fill{height:100%;border-radius:2px;background:var(--dk-success)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.num.g{color:var(--dk-success)}.num.r{color:var(--dk-danger)}
/* Registry */
.section{background:var(--dk-surface);border:1px solid var(--dk-line);border-radius:12px;overflow:hidden}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--dk-line);padding:0 16px}
.tab{padding:11px 14px;color:var(--dk-ink-3);cursor:pointer;border-bottom:2px solid transparent;font-size:13px;font-weight:500}
.tab:hover{color:var(--dk-ink-2)}
.tab.on{color:var(--dk-primary-h);border-bottom-color:var(--dk-primary)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--dk-line)}
input.fi,select.fi{background:var(--dk-page);border:1px solid var(--dk-line);color:var(--dk-ink);border-radius:7px;padding:7px 11px;font-size:12px;outline:none}
input.fi:focus,select.fi:focus{border-color:var(--dk-primary)}
input.fi::placeholder{color:var(--dk-ink-3)}
.btn{background:var(--dk-line);color:var(--dk-ink-2);border:none;border-radius:7px;padding:7px 14px;font-size:12px;cursor:pointer}
.btn:hover{background:var(--dk-line-2);color:var(--dk-ink)}
.cnt{color:var(--dk-ink-3);font-size:12px;margin-left:auto}
.reg-wrap{overflow-x:auto}
.rt{width:100%;border-collapse:collapse;font-size:12px}
.rt th{text-align:left;padding:8px 10px;color:var(--dk-ink-3);font-size:10px;font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--dk-line);cursor:pointer;white-space:nowrap;user-select:none}
.rt th:hover{color:var(--dk-ink-2)}
.rt td{padding:8px 10px;border-bottom:1px solid var(--dk-surface);vertical-align:top}
.rt tr:hover td{background:var(--dk-surface-2)}
.rt tr.u td{border-left:2px solid var(--dk-danger)}
.rt tr.p td{border-left:2px solid var(--dk-success)}
.rt tr.h td{border-left:2px solid var(--dk-warning)}
.tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;white-space:nowrap}
.tu{background:var(--dk-danger-tint);color:var(--dk-danger)}.tp{background:var(--dk-success-tint);color:var(--dk-success)}.th{background:var(--dk-warning-tint);color:var(--dk-warning)}
.tpr{background:var(--dk-primary-tint);color:var(--dk-primary-h)}
.pag{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--dk-line)}
.pb{background:var(--dk-line);color:var(--dk-ink-2);border:none;border-radius:5px;padding:5px 10px;cursor:pointer;font-size:12px}
.pb:hover{background:var(--dk-line-2)}.pb.on{background:var(--dk-primary);color:#fff}
.pi{color:var(--dk-ink-3);font-size:12px}
.none{text-align:center;padding:32px;color:var(--dk-ink-3);font-size:13px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <div>
    <div style="font-size:18px;font-weight:600;color:#fff">ДДС — Реестр платежей ДКБИ</div>
    <div class="sub">Загружено из Google Sheets · Реестр платежей</div>
  </div>
  <span class="badge">Июнь 2026</span>
</div>
<div class="container">
  <div class="kpis" id="kpis"></div>
  <div class="grid2">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Прогноз выплат — Июнь 2026</span>
        <span class="card-sub" id="jtotal"></span>
      </div>
      <div class="card-body"><div id="chart"></div></div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">ДДС по статьям</span>
        <span class="card-sub">из реестра</span>
      </div>
      <div style="overflow:auto;max-height:280px">
        <table class="dds-tbl" id="ddst"></table>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="tabs">
      <div class="tab on" onclick="tab('all',this)">Все платежи</div>
      <div class="tab" onclick="tab('unpaid',this)">К оплате</div>
      <div class="tab" onclick="tab('paid',this)">Оплачено</div>
    </div>
    <div class="filters">
      <input class="fi" id="q" placeholder="🔍 Контрагент, статья, комментарий..." oninput="filt()" style="width:260px">
      <select class="fi" id="fdiv" onchange="filt()"><option value="">Все подразделения</option></select>
      <select class="fi" id="fst" onchange="filt()">
        <option value="">Все статусы</option>
        <option value="u">К оплате</option>
        <option value="h">Частично</option>
        <option value="p">Оплачено</option>
      </select>
      <button class="btn" onclick="reset()">Сбросить</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="reg-wrap">
      <table class="rt">
        <thead><tr>
          <th onclick="srt('статья')">Статья</th>
          <th onclick="srt('контрагент')">Контрагент</th>
          <th onclick="srt('подразделение')">Подразделение</th>
          <th onclick="srt('приоритет')">Прио</th>
          <th onclick="srt('сумма_счета')" style="text-align:right">Счёт ₽</th>
          <th onclick="srt('сумма_оплаты')" style="text-align:right">Оплата ₽</th>
          <th onclick="srt('к_оплате')" style="text-align:right">К оплате ₽</th>
          <th onclick="srt('дата_оплаты')">Дата</th>
          <th>Комментарий</th>
          <th>Статус</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div class="pag" id="pag"></div>
  </div>
</div>

let cur=1,ps=20,fd=[...P],sk='к_оплате',sd=-1,atab='all';
(function(){
  const divs=[...new Set(P.map(p=>p.подразделение).filter(Boolean))].sort();
  const s=document.getElementById('fdiv');
  divs.forEach(d=>{const o=document.createElement('option');o.value=o.textContent=d;s.appendChild(o)});

function filt(){
  const q=document.getElementById('q').value.toLowerCase();
  const dv=document.getElementById('fdiv').value;
  const fs=document.getElementById('fst').value;
  fd=P.filter(p=>{
    if(atab==='unpaid'&&st(p)==='p')return false;
    if(atab==='paid'&&st(p)!=='p')return false;
    if(q&&!p.контрагент.toLowerCase().includes(q)&&!p.статья.toLowerCase().includes(q)&&!p.комментарий.toLowerCase().includes(q))return false;
    if(dv&&p.подразделение!==dv)return false;
    if(fs&&st(p)!==fs)return false;
    return true;
  });
  fd.sort((a,b)=>{let va=a[sk],vb=b[sk];if(typeof va==='string')return sd*va.localeCompare(vb||'');return sd*((va||0)-(vb||0));});
  cur=1;rend();
}
function tab(t,el){atab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');filt()}

  const tot=fd.length,pgs=Math.ceil(tot/ps)||1,s=(cur-1)*ps,rows=fd.slice(s,s+ps);
  document.getElementById('cnt').textContent=`Показано ${s+1}–${Math.min(s+ps,tot)} из ${tot}`;
  const stag={u:'<span class="tag tu">К оплате</span>',h:'<span class="tag th">Частично</span>',p:'<span class="tag tp">Оплачен</span>'};
  document.getElementById('tb').innerHTML=rows.length?rows.map(p=>{
    const s2=st(p);
    return`<tr class="${s2}"><td style="max-width:200px;color:var(--dk-ink-2);font-size:11px">${p.статья.slice(0,75)}</td><td style="font-weight:500;white-space:nowrap">${p.контрагент}</td><td style="color:var(--dk-ink-2);font-size:11px;white-space:nowrap">${p.подразделение||'—'}</td><td><span class="tag tpr">${p.приоритет}</span></td><td class="num" style="text-align:right">${fmt(p.сумма_счета)}</td><td class="num g" style="text-align:right">${p.сумма_оплаты>0?fmt(p.сумма_оплаты):'—'}</td><td class="num ${p.к_оплате>0?'r':''}" style="text-align:right;font-weight:600">${p.к_оплате>0?fmt(p.к_оплате):'—'}</td><td style="color:var(--dk-ink-2);font-size:11px;white-space:nowrap">${p.дата_оплаты||'—'}</td><td style="color:var(--dk-ink-3);font-size:11px;max-width:160px">${p.комментарий}</td><td>${stag[s2]}</td></tr>`;
  }).join(''):'<tr><td colspan="10" class="none">Нет данных</td></tr>';
  // Pagination
  let ph=`<span class="pi">${cur}/${pgs}</span><button class="pb" onclick="gp(${cur-1})" ${cur<=1?'disabled':''}>←</button>`;
  for(let i=Math.max(1,cur-2);i<=Math.min(pgs,cur+2);i++)ph+=`<button class="pb ${i===cur?'on':''}" onclick="gp(${i})">${i}</button>`;
  ph+=`<button class="pb" onclick="gp(${cur+1})" ${cur>=pgs?'disabled':''}>→</button>`;
  document.getElementById('pag').innerHTML=ph;
}
function gp(p){const pgs=Math.ceil(fd.length/ps)||1;if(p<1||p>pgs)return;cur=p;rend()}
filt();
</script>
</body>
</html>
