<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дебиторка — ДКБИ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--card:#161b22;--border:#30363d;--border2:#21262d;
  --text:#c9d1d9;--text2:#8b949e;--text3:#484f58;
  --blue:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#e3b341;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.nav{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--card);flex-wrap:wrap;align-items:center}
.nav a{color:var(--text2);text-decoration:none;font-size:13px;padding:5px 12px;border-radius:6px;border:1px solid transparent;transition:all .15s}
.nav a:hover{background:var(--border2);color:var(--text)}
.nav a.active{background:var(--blue);color:#fff}

#upload-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 46px);padding:24px}
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:56px 72px;text-align:center;cursor:pointer;transition:all .2s;max-width:480px;width:100%}
.drop-zone:hover,.drop-zone.over{border-color:var(--blue);background:rgba(88,166,255,.05)}
.drop-icon{font-size:48px;margin-bottom:14px}
.drop-title{font-size:17px;font-weight:600;margin-bottom:8px}
.drop-sub{color:var(--text2);font-size:13px;line-height:1.5;margin-bottom:20px}
.btn-primary{background:var(--blue);color:#fff;border:none;padding:9px 22px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn-primary:hover{opacity:.85}

#main-screen{display:none;padding:16px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.page-title{font-size:19px;font-weight:700;color:var(--blue)}
.page-meta{font-size:12px;color:var(--text2);margin-top:2px}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:6px;font-size:13px;cursor:pointer;transition:all .15s}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}

.kpi-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;min-width:145px;flex:1}
.kpi-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.kpi-val{font-size:21px;font-weight:700}
.kpi-sub{font-size:11px;color:var(--text2);margin-top:3px}
.kpi.red{border-color:rgba(248,81,73,.35)} .kpi.red .kpi-val{color:var(--red)}
.kpi.blue{border-color:rgba(88,166,255,.35)} .kpi.blue .kpi-val{color:var(--blue)}
.kpi.green{border-color:rgba(63,185,80,.35)} .kpi.green .kpi-val{color:var(--green)}
.kpi.yellow{border-color:rgba(227,179,65,.35)} .kpi.yellow .kpi-val{color:var(--yellow)}

.dept-block{background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden}
.dept-head{padding:11px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;transition:background .15s}
.dept-head:hover{background:var(--border2)}
.dept-head-title{font-size:14px;font-weight:700}
.dept-head-right{display:flex;gap:16px;align-items:center}
.dept-head-total{font-size:14px;font-weight:700}
.chevron{font-size:11px;color:var(--text2);transition:transform .2s}
.dept-block.open .chevron{transform:rotate(180deg)}

.mgr-table{width:100%;border-collapse:collapse;font-size:13px}
.mgr-table thead th{background:var(--border2);color:var(--text2);text-align:left;padding:7px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.mgr-table thead th.r{text-align:right}
.mgr-table td{padding:8px 14px;border-top:1px solid var(--border2)}
.mgr-table td.r{text-align:right;font-variant-numeric:tabular-nums}
.mgr-row{cursor:pointer;transition:background .1s}
.mgr-row:hover td{background:rgba(255,255,255,.03)}
.mgr-row.open-row td{background:rgba(88,166,255,.06)}

.bar-wrap{display:flex;align-items:center;gap:8px;min-width:100px}
.bar-bg{flex:1;height:4px;background:var(--border2);border-radius:2px}
.bar-fill{height:4px;border-radius:2px}

.clients-block{display:none;border-top:1px solid var(--border2);background:rgba(0,0,0,.25)}
.clients-block.open{display:block}
.client-table{width:100%;border-collapse:collapse;font-size:12px}
.client-table td{padding:5px 14px 5px 30px;border-top:1px solid rgba(255,255,255,.04);color:var(--text2)}
.client-table td.r{text-align:right;color:var(--text);font-variant-numeric:tabular-nums;padding-right:14px}
.client-table tr:hover td{background:rgba(255,255,255,.02)}

.empty-dept{text-align:center;padding:20px;color:var(--text3);font-size:13px}
.btn-copy-dept{background:transparent;border:1px solid var(--border);color:var(--text2);padding:3px 10px;border-radius:5px;font-size:12px;cursor:pointer;transition:all .15s}
.btn-copy-dept:hover{border-color:var(--blue);color:var(--blue)}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html">📊 РБУ</a>
  <a href="marketing.html">📈 Маркетинг</a>
  <a href="debitorka.html" class="active">💰 Дебиторка</a>
</nav>

<div id="upload-screen">
  <div class="drop-zone" id="dropZone"
       onclick="document.getElementById('fileInput').click()"
       ondragover="event.preventDefault();this.classList.add('over')"
       ondragleave="this.classList.remove('over')"
       ondrop="onDrop(event)">
    <div class="drop-icon">📂</div>
    <div class="drop-title">Загрузите ведомость из 1С</div>
    <div class="drop-sub">CSV с разделителем «;»<br>Колонки: Менеджер · Клиент · Долг клиента · Наш долг · Сальдо</div>
    <button class="btn-primary" onclick="event.stopPropagation();document.getElementById('fileInput').click()">Выбрать файл</button>
  </div>
  <input type="file" id="fileInput" accept=".csv,.txt" style="display:none" onchange="loadFile(this.files[0])">
</div>

<div id="main-screen">
  <div class="page-header">
    <div>
      <div class="page-title">💰 Дебиторская задолженность</div>
      <div class="page-meta" id="pageMeta"></div>
    </div>
    <button class="btn-ghost" onclick="copyToMax()" id="btnCopy">📋 Скопировать в MAX</button>
    <button class="btn-ghost" onclick="goBack()">↩ Другой файл</button>
  </div>
  <div class="kpi-row" id="kpiRow"></div>
  <div id="depts"></div>
</div>

<script>
// ── Отделы и менеджеры ────────────────────────────────────────────
const DEPTS = [
  { id:'bst',  label:'🏗 БСТ',         color:'#58a6ff', kpiCls:'blue',
    keys:['андреев','визильков','долгопятов','ушаков'] },
  { id:'jbi',  label:'🧱 ЖБИ',         color:'#3fb950', kpiCls:'green',
    keys:['морозов','лукина','мухитдинов','диденко','протченко'] },
  { id:'spec', label:'🚜 Спецтехника', color:'#e3b341', kpiCls:'yellow',
    keys:['зименко','генадьев'] },
];

function detectDept(name) {
  const l = name.toLowerCase();
  return DEPTS.find(d => d.keys.some(k => l.includes(k))) || null;
}

// ── Форматирование ───────────────────────────────────────────────
const nf = new Intl.NumberFormat('ru-RU');
const fmt = n => nf.format(Math.round(n)) + ' ₽';
const fmtM = n => {
  if (n >= 1e6) return (n/1e6).toFixed(1).replace('.',',') + ' млн ₽';
  if (n >= 1e3) return Math.round(n/1e3) + ' тыс ₽';
  return fmt(n);
};

// ── Парсинг CSV ──────────────────────────────────────────────────
// Парсер CSV (Менеджер;Клиент;Долг клиента;Наш долг;Сальдо)
function parseCSV(raw) {
  const text = raw.replace(/^\uFEFF/,'');
  const lines = text.split('\n');
  const result = [];
  for (let i = 1; i < lines.length; i++) {
    const l = lines[i].trim();
    if (!l) continue;
    const c = l.split(';').map(s => s.trim().replace(/^"|"$/g,''));
    if (c.length < 4) continue;
    const n = s => parseFloat(s.replace(/\s/g,'').replace(',','.')) || 0;
    result.push({ mgr: c[0], client: c[1], dolgClient: n(c[2]), nashDolg: n(c[3]), saldo: c[4] ? n(c[4]) : n(c[2]) - n(c[3]) });
  }
  return result;
}

// Парсер текстового формата (из MAX-сообщений или TXT из 1С)
// Формат: "Фамилия Имя Отчество\nДебиторка: X\nКлиент: X"
function parseTXT(raw) {
  const text = raw.replace(/^\uFEFF/,'');
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const result = [];
  let curMgr = null;

  const isMgrLine = l => /^[А-ЯЁ][а-яё]+ [А-ЯЁ][а-яё]+ [А-ЯЁ][а-яё]+$/.test(l);
  const parseAmt = s => {
    const m = s.match(/[\d\s]+/);
    return m ? parseInt(m[0].replace(/\s/g,''), 10) : 0;
  };

  for (const line of lines) {
    if (isMgrLine(line)) { curMgr = line; continue; }
    if (!curMgr) continue;
    if (/^Дебиторка:/.test(line)) continue; // итог менеджера — пропускаем
    // Строка клиента: "Название: СУММА"
    const m = line.match(/^(.+?):\s*([\d\s]+)\s*[₽?]?\s*$/);
    if (m) {
      const client = m[1].trim();
      const amt = parseAmt(m[2]);
      if (amt > 0 && !client.startsWith('УУ') && !['Предоплата','Долг','Сальдо'].includes(client)) {
        result.push({ mgr: curMgr, client, dolgClient: amt, nashDolg: 0, saldo: -amt });
      }
    }
  }
  return result;
}

function detectFormat(text) {
  const clean = text.replace(/^\uFEFF/,'').slice(0,500);
  if (/Дебиторская задолженность/i.test(clean)) return 'txt';
  if (clean.includes(';')) return 'csv';
  return 'txt';
}

// ── Агрегация ────────────────────────────────────────────────────
function aggregate(rows) {
  const byMgr = {};
  for (const r of rows) {
    if (!r.mgr || r.mgr.toLowerCase().includes('без менеджера')) continue;
    if (r.client.startsWith('УУ')) continue;
    // Дебиторка = клиент должен нам = dolgClient > nashDolg
    const debt = r.dolgClient - r.nashDolg;
    if (debt <= 0) continue;
    if (!byMgr[r.mgr]) byMgr[r.mgr] = { total: 0, clients: [] };
    byMgr[r.mgr].total += debt;
    byMgr[r.mgr].clients.push({ name: r.client, amount: debt });
  }
  for (const m of Object.values(byMgr)) {
    m.clients.sort((a,b) => b.amount - a.amount);
  }
  return byMgr;
}

// ── Рендер ───────────────────────────────────────────────────────
function render(byMgr) {
  // По отделам
  const deptMap = {};
  for (const d of DEPTS) deptMap[d.id] = { ...d, managers: [], total: 0 };

  for (const [name, data] of Object.entries(byMgr)) {
    const dept = detectDept(name);
    if (dept) {
      deptMap[dept.id].managers.push([name, data]);
      deptMap[dept.id].total += data.total;
    }
  }
  for (const d of Object.values(deptMap)) {
    d.managers.sort((a,b) => b[1].total - a[1].total);
  }

  const grandTotal = Object.values(deptMap).reduce((s,d) => s+d.total, 0);
  const maxMgr = Math.max(...Object.values(byMgr).map(d=>d.total), 1);

  // KPI
  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi red">
      <div class="kpi-label">Всего дебиторка</div>
      <div class="kpi-val">${fmtM(grandTotal)}</div>
      <div class="kpi-sub">${Object.keys(byMgr).length} менеджеров</div>
    </div>
    ${DEPTS.map(d => `
    <div class="kpi ${deptMap[d.id].kpiCls}">
      <div class="kpi-label">${d.label}</div>
      <div class="kpi-val">${fmtM(deptMap[d.id].total)}</div>
      <div class="kpi-sub">${deptMap[d.id].managers.length} чел · ${grandTotal ? Math.round(deptMap[d.id].total/grandTotal*100) : 0}%</div>
    </div>`).join('')}
  `;

  // Блоки отделов
  const container = document.getElementById('depts');
  container.innerHTML = '';

  for (const dept of Object.values(deptMap)) {
    const block = document.createElement('div');
    block.className = 'dept-block open';
    block.dataset.id = dept.id;

    const mgrRows = dept.managers.length ? dept.managers.map(([name, data], idx) => {
      const short = name.split(/\s+/).slice(0,2).join(' ');
      const cid = `cl-${dept.id}-${idx}`;
      const barPct = Math.round(data.total / maxMgr * 100);
      return `
        <tr class="mgr-row" onclick="toggleClients('${cid}',this)">
          <td>${short}</td>
          <td><div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${barPct}%;background:${dept.color}"></div></div></div></td>
          <td class="r">${fmt(data.total)}</td>
          <td class="r" style="color:var(--text2)">${data.clients.length}</td>
        </tr>
        <tr><td colspan="4" style="padding:0">
          <div class="clients-block" id="${cid}">
            <table class="client-table">
              ${data.clients.map(c=>`
              <tr><td>${c.name}</td><td class="r">${fmt(c.amount)}</td></tr>`).join('')}
            </table>
          </div>
        </td></tr>`;
    }).join('') : `<tr><td colspan="4" class="empty-dept">Нет данных</td></tr>`;

    block.innerHTML = `
      <div class="dept-head" onclick="toggleDept(this)">
        <div class="dept-head-title" style="color:${dept.color}">${dept.label}</div>
        <div class="dept-head-right">
          <button class="btn-copy-dept" onclick="event.stopPropagation();copyDept('${dept.id}')" id="copy-${dept.id}">📋 в MAX</button>
          <span class="dept-head-total" style="color:${dept.color}">${fmt(dept.total)}</span>
          <span class="chevron">▲</span>
        </div>
      </div>
      <table class="mgr-table">
        <thead><tr>
          <th>Менеджер</th><th></th>
          <th class="r">Дебиторка</th>
          <th class="r">Клиентов</th>
        </tr></thead>
        <tbody>${mgrRows}</tbody>
      </table>`;
    container.appendChild(block);
  }
}

function toggleDept(head) {
  head.closest('.dept-block').classList.toggle('open');
}

function toggleClients(id, row) {
  const el = document.getElementById(id);
  const open = el.classList.toggle('open');
  row.classList.toggle('open-row', open);
}

// ── Загрузка ─────────────────────────────────────────────────────
function loadFile(file) {
  if (!file) return;

  const doParse = text => {
    const fmt = detectFormat(text);
    return fmt === 'txt' ? parseTXT(text) : parseCSV(text);
  };

  // 1С всегда cp1251 — читаем сначала так, для UTF-8 файлов cp1251 тоже прочитает нормально ASCII-часть
  // Для надёжности пробуем cp1251 → utf-8
  // Пробуем UTF-8 → cp1251
  const r1 = new FileReader();
  r1.onload = e => {
    const rows = doParse(e.target.result);
    if (rows.length) { showDashboard(rows, file.name); return; }
    // Fallback: windows-1251
    const r2 = new FileReader();
    r2.onload = e2 => {
      const rows2 = doParse(e2.target.result);
      if (!rows2.length) { alert('Файл не распознан. Проверьте формат.'); return; }
      showDashboard(rows2, file.name);
    };
    r2.readAsText(file, 'windows-1251');
  };
  r1.readAsText(file, 'utf-8');
}

let _lastByMgr = null;
let _lastDeptMap = null;

function copyDept(deptId) {
  if (!_lastDeptMap) return;
  const dept = _lastDeptMap[deptId];
  if (!dept || !dept.managers.length) return;
  const today = new Date().toLocaleDateString('ru-RU');
  const lines = [`Дебиторка на ${today}`, `${dept.label} — ${fmtM(dept.total)}`, ''];
  for (const [name, data] of dept.managers) {
    const short = name.split(' ').slice(0,2).join(' ');
    lines.push(`${short}\nДебиторка: ${fmt(data.total)}`);
    for (const c of data.clients) lines.push(`${c.name}: ${fmt(c.amount)}`);
    lines.push('');
  }
  const btn = document.getElementById('copy-' + deptId);
  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    btn.textContent = '✅ Скопировано!';
    setTimeout(() => { btn.textContent = '📋 в MAX'; }, 2000);
  });
}

function copyToMax() {
  if (!_lastByMgr) return;
  const deptMap = {};
  for (const d of DEPTS) deptMap[d.id] = { ...d, managers: [], total: 0 };
  for (const [name, data] of Object.entries(_lastByMgr)) {
    const dept = detectDept(name);
    if (dept) { deptMap[dept.id].managers.push([name, data]); deptMap[dept.id].total += data.total; }
  }
  for (const d of Object.values(deptMap)) d.managers.sort((a,b) => b[1].total - a[1].total);
  _lastDeptMap = deptMap;

  const grand = Object.values(deptMap).reduce((s,d) => s+d.total, 0);
  const today = new Date().toLocaleDateString('ru-RU');
  const lines = [`Дебиторка на ${today}`, `Итого: ${fmtM(grand)}`, ''];

  for (const dept of Object.values(deptMap)) {
    if (!dept.managers.length) continue;
    lines.push(`${dept.label} — ${fmtM(dept.total)}`);
    for (const [name, data] of dept.managers) {
      const short = name.split(' ').slice(0,2).join(' ');
      lines.push(`\n${short}\nДебиторка: ${fmt(data.total)}`);
      for (const c of data.clients) {
        lines.push(`${c.name}: ${fmt(c.amount)}`);
      }
    }
    lines.push('');
  }

  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    const btn = document.getElementById('btnCopy');
    btn.textContent = '✅ Скопировано!';
    setTimeout(() => { btn.textContent = '📋 Скопировать в MAX'; }, 2000);
  });
}

function showDashboard(rows, filename) {
  const byMgr = aggregate(rows);
  _lastByMgr = byMgr;
  document.getElementById('pageMeta').textContent = filename + ' · ' + new Date().toLocaleDateString('ru-RU');
  document.getElementById('upload-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  render(byMgr);
}

function onDrop(e) {
  e.preventDefault();
  document.getElementById('dropZone').classList.remove('over');
  loadFile(e.dataTransfer.files[0]);
}

function goBack() {
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('upload-screen').style.display = 'flex';
  document.getElementById('fileInput').value = '';
}
</script>
</body>
</html>
